name: Sync World Cup Results

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos (mínimo permitido por GitHub Actions)
  workflow_dispatch:          # también puedes lanzarlo manualmente desde GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync
        env:
          FD_API_KEY: ${{ secrets.FD_API_KEY }}
          GH_TOKEN:   ${{ secrets.GH_TOKEN }}
          GH_OWNER:   ${{ github.repository_owner }}
          GH_REPO:    ${{ github.event.repository.name }}
        run: node sync.js --once
